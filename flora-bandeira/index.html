function setTab(t){if(['PDCA','Cadastros','Integrações','Usuários e acessos','Auditoria'].includes(t)&&state.role!=='gerente')return;if(state.role==='financeiro'&&!['Painel','Cobranças','Clientes'].includes(t))return;state.tab=t;render()}function addBudget(e){e.preventDefault();syncBudgetClient(e.target);const d=new FormData(e.target),assigned=state.role==='gerente'?(d.get('owner')||'gerente'):'vendedor',existing=findRegisteredClient(d.get('client')),region=existing?existing.region:e.target.elements.region.value;if(!region){alert('Selecione a região do cliente novo.');return}ensureClient(d.get('client'),region,assigned);state.budgets.push({id:Date.now(),owner:assigned,client:(existing?existing.name:String(d.get('client')).trim()),region,value:Number(d.get('value')),status:'Pendente',createdAt:d.get('createdAt')||todayISO(),closedAt:null});render()}function addCharge(e){e.preventDefault();syncChargeClient(e.target);const d=new FormData(e.target),assigned=state.role==='vendedor'?'vendedor':(d.get('owner')||'gerente'),due=d.get('method')==='Prazo 30 dias'?addDaysISO(d.get('saleDate'),30):d.get('due');const existing=findRegisteredClient(d.get('client'));const region=existing?existing.region:d.get('region');if(!region){alert('Selecione a região do cliente novo.');return}ensureClient(d.get('client'),region,assigned);state.charges.push({id:Date.now(),owner:assigned,client:(existing?existing.name:String(d.get('client')).trim()),region,value:Number(d.get('value')),due,saleDate:d.get('saleDate'),method:d.get('method'),status:'Pendente',payments:[],contacts:[]});render()}function addPayment(e,id){e.preventDefault();const x=state.charges.find(x=>x.id===id);if(!x||!(state.role!=='vendedor'||x.owner==='vendedor'))return;const amount=Number(new FormData(e.target).get('amount'));if(!Number.isFinite(amount)||amount<=0||amount>balance(x)+0.001){alert('Informe um valor válido, até o saldo em aberto.');return}x.payments=x.payments||[];x.payments.push({value:Math.round(amount*100)/100,d a-label="Vendedor responsável">${state.sellers.map(v=>`<option value="${safe(v.id)}">${safe(v.name)}</option>`).join('')}</select>`}function addRegion(e){e.preventDefault();if(state.role!=='gerente')return;let v=new FormData(e.target).get('name').trim();if(!v)return;if(state.regions.some(x=>x.toLocaleLowerCase('pt-BR')===v.toLocaleLowerCase('pt-BR'))){alert('Região já cadastrada.');return}state.regions.push(v);state.regions.sort((a,b)=>a.localeCompare(b,'pt-BR'));render()}function addSeller(e){e.preventDefault();if(state.role!=='gerente')return;let v=new FormData(e.target).get('name').trim();if(!v)return;if(state.sellers.some(x=>x.name.toLocaleLowerCase('pt-BR')===v.toLocaleLowerCase('pt-BR'))){alert('Vendedor já cadastrado.');return}let id='vend_'+Date.now();state.sellers.push({id,name:v});state.goals[id]=0;render()}function addPdca(e){e.preventDefault();if(state.role!=='gerente')return;const d=new FormData(e.target);state.pdca.push({id:Date.now(),name:d.get('name'),hypothesis:d.get('hypothesis'),status:'Planejar'});render()}function grossMargin(price,cost){return price>0?((price-cost)/price*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%':'—'}

ia','Sem resposta','Cliente desistiu','Outro'],x.lostReason||'')}</select></label></div><div class="budget-form-footer"><button type="button" onclick="closeBudgetEditor()">Cancelar</button><button type="submit" class="primary">Salvar alterações</button></div></form></section>`;

function saveBudgetEditor(event,id){event.preventDefault();const x=state.budgets.find(z=>z.id===id);if(!x||!canEdit(x))return;const form=event.target,d=new FormData(form),rawName=String(d.get('client')||'').trim().replace(/\s+/g,' '),existing=findRegisteredClient(rawName),region=existing?existing.region:form.elements.region.value,status=d.get('status'),value=Number(d.get('value'));if(!rawName||!region||!Number.isFinite(value)||value<0){alert('Preencha cliente, região e valor válido.');return}if(status==='Perdido'&&!d.get('lostReason')){alert('Selecione o motivo da perda.');return}const assigned=state.role==='gerente'?(d.get('owner')||x.owner):x.owner;ensureClient(rawName,region,assigned);const oldStatus=x.status;x.client=existing?existing.name:rawName;x.region=region;x.owner=assigned;x.value=value;x.createdAt=d.get('createdAt');x.status=status;x.lostReason=status==='Perdido'?d.get('lostReason'):null;x.closedAt=status==='Pendente'?null:(d.get('closedAt')||(oldStatus!==status?todayISO():x.closedAt)||todayISO());closeBudgetEditor();render()}

let accounts=[{id:'gerente',name:'Gerente comercial',email:'gerente@flora.demo',role:'gerente',status:'aprovado',bootstrap:true},{id:'vendedor',name:'Vendedor demonstração',email:'vendedor@flora.demo',role:'vendedor',status:'aprovado'},{id:'financeiro',name:'Financeiro demonstração',email:'financeiro@flora.demo',role:'financeiro',status:'aprovado'}];

try{const saved=JSON.parse(localStorage.getItem(DEMO_KEY)||'null');if(saved){if(Array.isArray(saved.accounts))accounts=saved.accounts;if(Array.isArray(saved.auditLog))auditLog=saved.auditLog;if(saved.data){for(const [k,v] of Object.entries(saved.data))if(k in state)state[k]=v}}}catch(e){console.warn('Dados de demonstração não carregados',e)}

function logAudit(action,area,description,before=null,after=null,who=null){const actor=who||activeAccount||{id:'sistema',name:'Sistema'};auditLog.unshift({id:Date.now()+'-'+Math.random().toString(36).slice(2,7),at:new Date().toISOString(),userId:actor.id,user:actor.name,role:actor.role||'sistema',action,area,description,before,after});persistDemo()}
function auditStateChanges(){const current=initialSnapshot();for(const [key,value] of Object.entries(current)){const old=previousSnapshot[key];if(JSON.stringify(value)===JSON.stringify(old))continue;const area=labelArea[key]||key;if(Array.isArray(value)&&Array.isArray(old)){const keyFor=(v,i)=>v&&typeof v==='object'?(v.id??(v.name?String(v.name).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase():i)):String(v);const oldMap=new Map(old.map((v,i)=>[String(keyFor(v,i)),v]));const newMap=new Map(value.map((v,i)=>[String(keyFor(v,i)),v]));for(const [id,v] of newMap){const before=oldMap.get(id);if(before===undefined)logAudit('Criação',area,'Registro '+id+' cadastrado',null,v);else if(JSON.stringify(before)!==JSON.stringify(v)){const changes={};for(const k of new Set([...Object.keys(before||{}),...Object.keys(v||{})]))if(JSON.stringify(before?.[k])!==JSON.stringify(v?.[k]))changes[k]={antes:before?.[k]??null,depois:v?.[k]??null};logAudit('Edição',area,'Registro '+id+' alterado',changes,null)}}for(const [id,v] of oldMap)if(!newMap.has(id))logAudit('Exclusão',area,'Registro '+id+' excluído',v,null)}else{const changes={};for(const k of new Set([...Object.keys(old||{}),...Object.keys(value||{})]))if(JSON.stringify(old?.[k])!==JSON.stringify(value?.[k]))changes[k]={antes:old?.[k]??null,depois:value?.[k]??null};logAudit('Edição',area,'Configuração alterada',changes,null)}}previousSnapshot=current;persistDemo()}
function authScreen(message=''){document.getElementById('nav').innerHTML='';document.getElementById('content').innerHTML=`<div class="access-shell"><div class="access-card"><div class="access-icon">🌿</div><h2>Acesso à Flora Bandeira</h2><p class="muted">Demonstração do fluxo de autorização. Somente contas pré-cadastradas e aprovadas podem entrar.</p>${message?`<div class="access-alert">${safe(message)}</div>`:''}<form onsubmit="loginDemo(event)"><label>E-mail de usuário<input name="email" type="email" placeholder="seuemail@empresa.com" required autocomplete="username"></label><button class="primary" type="submit">Solicitar acesso</button></form><p class="muted" style="margin-top:15px">Contas de demonstração: gerente@flora.demo, vendedor@flora.demo e financeiro@flora.demo. A conta da gerente serve apenas para testar o fluxo; não há senha nem segurança real.</p></div></div>`;document.getElementById('signed-user').textContent='Não autenticado'}
function loginDemo(event){event.preventDefault();const email=String(new FormData(event.target).get('email')||'').trim().toLowerCase(),user=accounts.find(u=>u.email.toLowerCase()===email);if(!user){logAudit('Acesso negado','Segurança','Tentativa com e-mail não pré-cadastrado: '+email,null,null,{id:'desconhecido',name:'Não cadastrado'});authScreen('Acesso negado. Peça à gerente comercial para fazer seu pré-cadastro.');return}if(user.status!=='aprovado'){logAudit('Acesso negado','Segurança','Conta '+user.email+' com situação '+user.status,null,null,user);authScreen('Acesso bloqueado. Sua conta está '+user.status+'. Aguarde autorização da gerente.');return}activeAccount=user;state.role=user.role;state.tab=user.role==='financeiro'?'Cobranças':'Painel';document.getElementById('signed-user').textContent=user.name+' · '+({gerente:'Gerente',vendedor:'Vendedor',financeiro:'Financeiro'}[user.role]);logAudit('Entrada','Segurança','Entrada simulada de '+user.email,null,null,user);render()}

function preRegister(event){event.preventDefault();if(!activeAccount||activeAccount.role!=='gerente')return;const d=new FormData(event.target),name=String(d.get('name')||'').trim(),email=String(d.get('email')||'').trim().toLowerCase(),role=String(d.get('role'));if(!name||!email||!['gerente','vendedor','financeiro'].includes(role))return;if(accounts.some(a=>a.email.toLowerCase()===email)){alert('Este e-mail já está pré-cadastrado.');return}const account={id:'usr_'+Date.now(),name,email,role,status:'pendente'};accounts.push(account);logAudit('Pré-cadastro','Usuários','Conta criada aguardando aprovação: '+email,null,account);render()}

function renderUserAdmin(){const rows=accounts.map(a=>`<tr><td><b>${safe(a.name)}</b><br><small>${safe(a.email)}</small></td><td>${safe(a.role)}</td><td><span class="status-user ${safe(a.status)}">${safe(a.status)}</span></td><td>${a.bootstrap?'Conta inicial da demonstração':`<div class="user-actions">${['aprovado','pendente','bloqueado','rejeitado'].filter(x=>x!==a.status).map(st=>`<button type="button" onclick="updateAccount('${a.id}','${st}')">${({aprovado:'✓ Aprovar',pendente:'Pendente',bloqueado:'Bloquear',rejeitado:'Rejeitar'})[st]}</button>`).join('')}</div>`}</td></tr>`).join('');return `<div class="dashhead"><div><h2>🔐 Usuários e autorizações</h2><p class="muted">Somente a gerência faz o pré-cadastro, aprova, rejeita ou bloqueia acessos.</p></div><span class="tag warning">Simulação local</span></div><div class="panel"><h3>Pré-cadastrar funcionário</h3><form onsubmit="preRegister(event)" class="access-create"><input name="name" placeholder="Nome completo" required maxlength="90"><input name="email" type="email" placeholder="E-mail de acesso" required><select name="role"><option value="vendedor">Vendedor</option><option value="financeiro">Financeiro</option><option value="gerente">Gerente comercial</option></select><button class="primary">Criar pré-cadastro pendente</button></form></div><div class="panel" style="margin-top:14px;overflow-x:auto"><h3>Contas e situação</h3><table class="audit-table"><thead><tr><th>Usuário</th><th>Perfil</th><th>Situação</th><th>Autorizações</th></tr></thead><tbody>${rows}</tbody></table></div><div class="panel" style="margin-top:14px"><b>Regra demonstrada:</b> contas desconhecidas ou pendentes não entram. A aprovação é exclusiva da gerente. <b>Na implantação real:</b> cadastro, login, sessões e permissões precisam ser verificados no servidor com autenticação segura, e não por este HTML.</div>`}
function setAuditFilter(field,value){if(field==='user')auditFilterUser=value;if(field==='area')auditFilterArea=value;if(field==='action')auditFilterAction=value;if(field==='search')auditSearch=value;render()}
const auditNames={client:'Cliente',name:'Nome',region:'Região',owner:'Vendedor responsável',value:'Valor',status:'Situação',createdAt:'Data do orçamento',closedAt:'Data de fechamento',lostReason:'Motivo da perda',due:'Vencimento',saleDate:'Data da venda',method:'Condição de pagamento',payments:'Pagamentos',contacts:'Contatos',priceWholesale:'Preço atacado',priceRetail:'Preço varejo',wholesale:'Preço atacado',retail:'Preço varejo',cost:'Custo',size:'Tamanho',quantity:'Quantidade',linearSpacing:'Espaçamento linear',spacingType:'Tipo de espaçamento',spacingMin:'Mínimo de mudas',spacingMax:'Máximo de mudas',spacingDistance:'Distância entre mudas',email:'E-mail',role:'Perfil',date:'Data',description:'Descrição',id:'Identificador',phone:'Telefone',notes:'Observações',goal:'Meta',min:'Mínimo',max:'Máximo',unit:'Unidade',approved:'Aprovação',type:'Tipo'};
function auditLabel(k){return auditNames[k]||String(k).replace(/([a-z])([A-Z])/g,'$1 $2').replace(/_/g,' ').replace(/^./,c=>c.toUpperCase())}
function auditValue(v,k=''){if(v===null||v===undefined||v==='')return '<span class="audit-empty">Não informado</span>';if(typeof v==='boolean')return v?'Sim':'Não';if(typeof v==='number'){if(/^(value|cost|wholesale|retail|priceWholesale|priceRetail|amount|price)$/i.test(k))return safe(money(v));return safe(String(v).replace('.',','))}if(Array.isArray(v))return v.length?`<span>${v.length} registro(s)</span>`:'<span class="audit-empty">Nenhum</span>';if(typeof v==='object')return '<span>Dados detalhados</span>';if(/^\d{4}-\d{2}-\d{2}$/.test(v))return safe(v.split('-').reverse().join('/'));return safe(String(v))}
function auditFlatten(obj,prefix='',out={}){if(obj===null||obj===undefined)return out;if(Array.isArray(obj)){out[prefix||'Itens']=obj;return out}if(typeof obj!=='object'){out[prefix||'Valor']=obj;return out}for(const [k,v] of Object.entries(obj)){if(k==='id'&&prefix==='')continue;const path=prefix?prefix+' / '+auditLabel(k):auditLabel(k);if(v&&typeof v==='object'&&!Array.isArray(v))auditFlatten(v,path,out);else out[path]=v}return out}
function auditDetails(x){if(x.before===null&&x.after===null)return '';let before=x.before,after=x.after;if(before&&after&&typeof before==='object'&&typeof after==='object'){const b=auditFlatten(before),a=auditFlatten(after),keys=[...new Set([...Object.keys(b),...Object.keys(a)])].filter(k=>JSON.stringify(b[k])!==JSON.stringify(a[k]));if(!keys.length)return '<p class="muted">Nenhuma diferença identificada.</p>';return `<div class="audit-change-list">${keys.map(k=>`<div class="audit-change"><div class="audit-field">${safe(k)}</div><div class="audit-values"><div class="audit-old"><small>ANTES</small><div>${auditValue(b[k],k.split(' / ').pop())}</div></div><span class="audit-arrow">→</span><div class="audit-new"><small>DEPOIS</small><div>${auditValue(a[k],k.split(' / ').pop())}</div></div></div></div>`).join('')}</div>`}const data=after===null?before:after;const fields=auditFlatten(data);const action=after===null?'Registro removido':before===null?'Registro incluído':'Movimentação';return `<div class="audit-change-list"><b>${action}</b>${Object.entries(fields).map(([k,v])=>`<div class="audit-simple"><span>${safe(k)}</span><strong>${auditValue(v,k)}</strong></div>`).join('')}</div>`}
function auditSummary(x){if(x.before&&x.after&&typeof x.before==='object'&&typeof x.after==='object'){const b=auditFlatten(x.before),a=auditFlatten(x.after);const keys=[...new Set([...Object.keys(b),...Object.keys(a)])].filter(k=>JSON.stringify(b[k])!==JSON.stringify(a[k]));return keys.length?keys.slice(0,3).join(', ')+(keys.length>3?` e mais ${keys.length-3}`:''):'Movimentação registrada'}return x.before===null&&x.after!==null?'Novo registro':x.after===null&&x.before!==null?'Registro excluído':x.description}
function renderAudit(){const users=[...new Set(auditLog.map(x=>x.userId))],areas=[...new Set(auditLog.map(x=>x.area))],actions=[...new Set(auditLog.map(x=>x.action))],select=(field,options,current)=>`<select onchange="setAuditFilter('${field}',this.value)"><option value="${field==='user'?'todos':'todas'}">${field==='user'?'Todos os usuários':field==='area'?'Todas as áreas':'Todas as ações'}</option>${options.map(x=>`<option value="${safe(x)}" ${x===current?'selected':''}>${safe(field==='user'?(auditLog.find(z=>z.userId===x)?.user||x):x)}</option>`).join('')}</select>`;const rows=auditLog.filter(x=>(auditFilterUser==='todos'||x.userId===auditFilterUser)&&(auditFilterArea==='todas'||x.area===auditFilterArea)&&(auditFilterAction==='todas'||x.action===auditFilterAction)&&(!auditSearch||JSON.stringify(x).toLocaleLowerCase('pt-BR').includes(auditSearch.toLocaleLowerCase('pt-BR'))));return `<div class="dashhead"><div><h2>📋 Auditoria detalhada</h2><p class="muted">Veja o que foi alterado, os valores anteriores e os novos valores, com data e responsável.</p></div><span class="tag">${rows.length} eventos</span></div><div class="panel"><div class="audit-filters">${select('user',users,auditFilterUser)}${select('area',areas,auditFilterArea)}${select('action',actions,auditFilterAction)}<input type="search" placeholder="Buscar no histórico" value="${safe(auditSearch)}" onchange="setAuditFilter('search',this.value)"><button type="button" onclick="exportAudit()">↓ Exportar CSV</button></div><div class="audit-scroller"><table class="audit-table"><thead><tr><th>Data e hora</th><th>Usuário</th><th>Ação</th><th>Área</th><th>O que aconteceu</th></tr></thead><tbody>${rows.slice(0,500).map(x=>`<tr><td>${new Date(x.at).toLocaleString('pt-BR')}</td><td><b>${safe(x.user)}</b><br><small>${safe(x.role)}</small></td><td>${safe(x.action)}</td><td>${safe(x.area)}</td><td><div>${safe(x.description)}</div>${x.before!==null||x.after!==null?`<details class="audit-detail"><summary>🔎 Ver alterações: ${safe(auditSummary(x))}</summary>${auditDetails(x)}</details>`:''}</td></tr>`).join('')||'<tr><td colspan="5">Nenhum evento para estes filtros.</td></tr>'}</tbody></table></div><p class="muted">Exibindo até 500 registros. O CSV exporta os registros filtrados.</p></div><div class="panel" style="margin-top:14px"><b>Importante:</b> esta é uma auditoria de demonstração salva no navegador. A versão online deverá registrar eventos no servidor, protegidos contra alterações e exclusões.</div>`}
function exportAudit(){if(!activeAccount||activeAccount.role!=='gerente')return;const rows=auditLog.filter(x=>(auditFilterUser==='todos'||x.userId===auditFilterUser)&&(auditFilterArea==='todas'||x.area===auditFilterArea)&&(auditFilterAction==='todas'||x.action===auditFilterAction)&&(!auditSearch||JSON.stringify(x).toLocaleLowerCase('pt-BR').includes(auditSearch.toLocaleLowerCase('pt-BR'))));const csv=[['Data/hora','Usuário','ID usuário','Perfil','Ação','Área','Descrição','Antes','Depois'],...rows.map(x=>[x.at,x.user,x.userId,x.role,x.action,x.area,x.description,JSON.stringify(x.before),JSON.stringify(x.after)])].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='auditoria_flora_bandeira.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
